[server:main]
use = egg:waitress#main
host = 0.0.0.0
port = 6543

# Begin logging configuration

[loggers]
keys = root, opensipkd, sqlalchemy, eispajak

[handlers]
keys = console
#, filelog, tabel

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
#, filelog, tabel

[logger_opensipkd]
level = DEBUG
handlers =
qualname = opensipkd

[logger_eispajak]
level = DEBUG
handlers =
qualname = eispajak

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
# "level = INFO" logs SQL queries.
# "level = DEBUG" logs SQL queries and results.
# "level = WARN" logs neither.  (Recommended for production systems.)

[handler_filelog]
class = FileHandler
args = ('log_file_location','a')
level = INFO
formatter = generic


[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[handler_tabel]
class = opensipkd.base.handlers.SQLAlchemyHandler
args = ()
level = WARN
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s][%(threadName)s] %(message)s

[alembic_ziggurat]
script_location = ziggurat_foundations:migrations
