[build-system]
requires = ['setuptools >= 64', 'wheel']
build-backend = 'setuptools.build_meta'

[tool.mypy]
exclude = [
    'base',
    'report', 
    'external', 
    'developers',
]
show_error_codes = true

[[tool.mypy.overrides]]

module = [
    "opensipkd.base.*",
    "opensipkd.models.*",
    "opensipkd.detable.*",
    "opensipkd.jsonrpc_auth.*",
]

warn_unused_ignores = true
strict = true


[project]
name = 'opensipkd-base'
version = '4.2'
dependencies = [
    'sqlalchemy',
    'colander',
    'pyramid',
    'pyramid_tm',
    "pyramid_beaker",
    "pyramid_mailer",
    'SQLAlchemy',
    'transaction',
    'waitress',
    'pyramid_beaker',
    'pyramid_mailer',
    'ziggurat-foundations',
    'zope.sqlalchemy',
    'pytz',
    'deform',
    'psycopg2-binary',
    'pyramid_chameleon',
    'pyramid_rpc',
    'requests',
    'sqlalchemy-datatables',
    'py3o.template',
    'wheezy.captcha',
    'icecream',
    'google-api-python-client',
    'google',
    'pyjwt',
    ]
requires-python = '>= 3.8'

authors = [
    {name='Agus Gustiana', email='aa.gustiana@gmail.com'},
    { email = "opensipkd@gmail.com" },]

maintainers = [
    { name = "Ari", email = "ariagungprasetiyo@gmail.com" },
    { name = "Owo Sugiana", email = "sugiana@gmail.com" }]

description = 'Framwork Aplikasi openSIPKD'
readme = 'README.rst'
license = {text='Apache Software License'}
keywords = ["openSIPKD"]
classifiers = [
    #'Development Status :: 4 - Beta",
    #'Programming Language :: Python :: 3',
    #'Operating System :: OS Independent',
    #'Framework :: Pylons',
    #'Topic :: Internet :: WWW/HTTP',
    #'Topic :: Internet :: WWW/HTTP :: WSGI :: Application',
]

[project.optional-dependencies]
dev = [
    'pyramid_debugtoolbar',
    'pytest', 'webtest']

[project.entry-points."paste.app_factory"]
main = 'opensipkd.base:main'

[project.scripts]
initialize_opensipkd_db = 'opensipkd.base.scripts.initializedb:main'
import_log = 'opensipkd.base.scripts.import_log:main'
